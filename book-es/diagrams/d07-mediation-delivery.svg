<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1264" role="img" aria-labelledby="d07-mediation-delivery-title d07-mediation-delivery-desc">
<title id="d07-mediation-delivery-title">Mediación y entrega tras una desconexión</title>
<desc id="d07-mediation-delivery-desc">La billetera establece la mediación y registra las claves del destinatario. Comparte la información de enrutamiento con un remitente y se desconecta mientras el mediador pone su mensaje cifrado en cola. Después se conecta de nuevo para recuperar y confirmar el mensaje antes de que el mediador lo elimine.</desc>
<defs>
<marker id="d07-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56616b"/></marker>
<marker id="d07-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18bc9c"/></marker>
</defs>
<rect width="960" height="1264" fill="#ffffff"/>
<text x="40" y="48" fill="#212529" font-size="28" font-weight="600">Mediación y entrega tras una desconexión</text>
<text x="40" y="80" fill="#56616b" font-size="20">Coordinate Mediation 2.0 · Routing 2.0 · Message Pickup 3.0</text>
<g stroke="#b8c2c8" stroke-width="1" stroke-dasharray="6 6">
<path d="M152 184 V1192"/>
<path d="M480 184 V1192"/>
<path d="M808 184 V1192"/>
</g>
<rect x="728" y="528" width="160" height="208" rx="4" fill="#f0f3f4" stroke="#b8c2c8" stroke-width="1"/>
<text x="808" y="584" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Sin conexión</text>
<text x="808" y="616" fill="#56616b" font-size="16" text-anchor="middle">Sin recogida</text>
<path d="M808 240 H480" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d07-arrow)"/>
<rect x="488" y="184" width="312" height="48" fill="#ffffff"/>
<text x="644" y="208" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Solicitar mediación</text>
<text class="technical" x="644" y="228" fill="#56616b" font-size="16" text-anchor="middle">mediate-request</text>
<path d="M480 304 H808" fill="none" stroke="#56616b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#d07-arrow)"/>
<rect x="488" y="248" width="312" height="48" fill="#ffffff"/>
<text x="644" y="272" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Conceder datos de enrutamiento</text>
<text class="technical" x="644" y="292" fill="#56616b" font-size="16" text-anchor="middle">mediate-grant</text>
<path d="M808 368 H480" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d07-arrow)"/>
<rect x="488" y="312" width="312" height="48" fill="#ffffff"/>
<text x="644" y="336" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Registrar claves del destinatario</text>
<text class="technical" x="644" y="356" fill="#56616b" font-size="16" text-anchor="middle">keylist-update</text>
<path d="M480 432 H808" fill="none" stroke="#56616b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#d07-arrow)"/>
<rect x="488" y="376" width="312" height="48" fill="#ffffff"/>
<text x="644" y="400" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Confirmar registro</text>
<text class="technical" x="644" y="420" fill="#56616b" font-size="16" text-anchor="middle">keylist-update-response</text>
<path d="M808 496 H152" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d07-arrow)"/>
<rect x="160" y="460" width="312" height="28" fill="#ffffff"/>
<text x="316" y="480" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Compartir rutas DIDComm</text>
<path d="M152 640 H480" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d07-arrow)"/>
<rect x="160" y="584" width="312" height="48" fill="#ffffff"/>
<text x="316" y="608" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Reenviar mensaje cifrado</text>
<text class="technical" x="316" y="628" fill="#56616b" font-size="16" text-anchor="middle">forward</text>
<path d="M808 824 H480" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d07-arrow)"/>
<rect x="488" y="768" width="312" height="48" fill="#ffffff"/>
<text x="644" y="792" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Solicitar mensajes en cola</text>
<text class="technical" x="644" y="812" fill="#56616b" font-size="16" text-anchor="middle">delivery-request</text>
<path d="M480 880 H808" fill="none" stroke="#18bc9c" stroke-width="2" marker-end="url(#d07-arrow-accent)"/>
<rect x="488" y="824" width="312" height="48" fill="#ffffff"/>
<text x="644" y="848" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Entregar adjuntos cifrados</text>
<text class="technical" x="644" y="868" fill="#56616b" font-size="16" text-anchor="middle">delivery</text>
<path d="M808 1024 H480" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d07-arrow)"/>
<rect x="488" y="968" width="312" height="48" fill="#ffffff"/>
<text x="644" y="992" fill="#212529" font-size="18" font-weight="600" text-anchor="middle">Confirmar IDs de mensajes recibidos</text>
<text class="technical" x="644" y="1012" fill="#56616b" font-size="16" text-anchor="middle">messages-received</text>
<path d="M480 1168 H808" fill="none" stroke="#56616b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#d07-arrow)"/>
<rect x="488" y="1112" width="312" height="48" fill="#ffffff"/>
<text x="644" y="1136" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Informar del estado de la cola</text>
<text class="technical" x="644" y="1156" fill="#56616b" font-size="16" text-anchor="middle">status</text>
<rect x="40" y="112" width="224" height="72" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
<text x="152" y="136" fill="#56616b" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">REMITENTE</text>
<text x="152" y="164" fill="#212529" font-size="22" font-weight="600" text-anchor="middle">Emisor / verificador</text>
<rect x="368" y="112" width="224" height="72" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
<text x="480" y="136" fill="#56616b" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">RETRANSMISOR</text>
<text x="480" y="164" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">Mediador</text>
<rect x="696" y="112" width="224" height="72" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
<text x="808" y="136" fill="#56616b" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">DESTINATARIO</text>
<text x="808" y="164" fill="#212529" font-size="24" font-weight="600" text-anchor="middle">Billetera del titular</text>
<rect x="40" y="520" width="224" height="64" rx="4" fill="#f0f3f4" stroke="#b8c2c8" stroke-width="1"/>
<text x="152" y="548" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Cifrar para la billetera</text>
<text x="152" y="572" fill="#56616b" font-size="16" text-anchor="middle">Envolver para el mediador</text>
<rect x="368" y="664" width="224" height="72" rx="4" fill="#eefaf7" stroke="#18bc9c" stroke-width="1"/>
<text x="480" y="692" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Encolar texto cifrado</text>
<text x="480" y="716" fill="#56616b" font-size="16" text-anchor="middle">Mensajes en MongoDB</text>
<rect x="696" y="904" width="224" height="64" rx="4" fill="#f0f3f4" stroke="#b8c2c8" stroke-width="1"/>
<text x="808" y="932" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Descifrar el mensaje</text>
<text x="808" y="956" fill="#56616b" font-size="16" text-anchor="middle">Usar claves de la billetera</text>
<rect x="368" y="1048" width="224" height="64" rx="4" fill="#f0f3f4" stroke="#b8c2c8" stroke-width="1"/>
<text x="480" y="1076" fill="#212529" font-size="20" font-weight="600" text-anchor="middle">Eliminar IDs recibidos</text>
<text x="480" y="1100" fill="#56616b" font-size="16" text-anchor="middle">Eliminar mensajes confirmados</text>
<rect x="720" y="740" width="192" height="28" fill="#ffffff"/>
<text x="816" y="760" fill="#56616b" font-size="16" text-anchor="middle">Billetera se reconecta</text>
<path d="M40 1216 H920" stroke="#dce1e4" stroke-width="1"/>
<text x="40" y="1248" fill="#56616b" font-size="16">Recogida correcta. El mediador lee los datos de enrutamiento; la billetera descifra la carga útil.</text>
</svg>
