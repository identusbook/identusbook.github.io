<figure id="d09-didcomm-envelope" aria-label="Interior de un mensaje DIDComm con mediación">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&amp;display=swap"/>
<style>
#d09-didcomm-envelope { margin: 24px auto; max-width: 960px; scroll-margin-top: 96px; color: #212529; font-family: Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
#d09-didcomm-envelope svg { display: block; width: 100%; height: auto; }
#d09-didcomm-envelope svg text { font-family: Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
#d09-didcomm-envelope svg .technical { font-family: SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
#d09-didcomm-envelope figcaption { padding: 12px 24px 0; font-size: 16px; line-height: 1.5; color: #56616b; text-align: left; }
</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 752" role="img" aria-labelledby="d09-didcomm-envelope-title d09-didcomm-envelope-desc">
<title id="d09-didcomm-envelope-title">Interior de un mensaje DIDComm con mediación</title>
<desc id="d09-didcomm-envelope-desc">Un mensaje cifrado para el mediador contiene instrucciones de reenvío y un adjunto cifrado para el destinatario. El mediador lee las instrucciones de enrutamiento y el destinatario descifra el adjunto para leer el mensaje de aplicación.</desc>
<rect width="960" height="752" fill="#ffffff"/>
<text x="40" y="48" fill="#212529" font-size="28" font-weight="600">Interior de un mensaje DIDComm con mediación</text>
<text x="40" y="80" fill="#56616b" font-size="20">Un salto de mediador; capas de cifrado expandidas</text>
<rect x="40" y="144" width="880" height="512" rx="4" fill="#f0f3f4" stroke="#b8c2c8" stroke-width="1"/>
<text x="64" y="172" fill="#56616b" font-size="12" font-weight="700" letter-spacing="2">1 · ENVOLTURA DE ENRUTAMIENTO</text>
<text x="64" y="208" fill="#212529" font-size="24" font-weight="600">Cifrado para el mediador</text>
<text x="64" y="240" fill="#56616b" font-size="20">El mediador descifra esta capa y lee las instrucciones de reenvío.</text>
<text class="technical" x="64" y="280" fill="#212529" font-size="16">type: https://didcomm.org/routing/2.0/forward</text>
<text class="technical" x="64" y="308" fill="#212529" font-size="16">body.next: DID del destinatario o identificador de enrutamiento</text>
<rect x="72" y="336" width="816" height="288" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
<text x="96" y="364" fill="#56616b" font-size="12" font-weight="700" letter-spacing="2">2 · ADJUNTO CIFRADO</text>
<text x="96" y="400" fill="#212529" font-size="24" font-weight="600">Cifrado para el destinatario</text>
<text x="96" y="432" fill="#56616b" font-size="20">El mediador encola o reenvía este texto cifrado sin leer su contenido.</text>
<rect x="104" y="464" width="752" height="128" rx="4" fill="#eefaf7" stroke="#18bc9c" stroke-width="1"/>
<text x="128" y="492" fill="#56616b" font-size="12" font-weight="700" letter-spacing="2">3 · MENSAJE DE APLICACIÓN</text>
<text x="128" y="528" fill="#212529" font-size="24" font-weight="600">El destinatario descifra el adjunto para leer este mensaje</text>
<text class="technical" x="128" y="564" fill="#212529" font-size="16">id · type · body · attachments (opcional)</text>
<path d="M40 696 H920" stroke="#dce1e4" stroke-width="1"/>
<text x="40" y="728" fill="#56616b" font-size="16">El mediador lee el siguiente destino de enrutamiento. El destinatario lee el contenido de aplicación.</text>
</svg>
<figcaption>El remitente cifra el mensaje de aplicación para el destinatario, adjunta ese texto cifrado a un mensaje <code>forward</code> y cifra el mensaje externo para el mediador. Las capas expandidas muestran el contenido después de cada paso de descifrado.</figcaption>
</figure>
