<title id="d17-did-publication-readback-title">DID publication and indexed readback</title>
<desc id="d17-did-publication-readback-desc">The Cloud Agent sends a signed DID operation to PRISM Node. PRISM Node uses Cardano Wallet to submit a transaction. Cardano DB Sync indexes ledger blocks, and PRISM Node reads the confirmed operation before the Cloud Agent reports the DID as published.</desc>
