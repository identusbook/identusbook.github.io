on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SVG renderer and diagram font
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-lato

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render website
        run: quarto render .

      - name: Render English book
        run: quarto render book

      - name: Render Spanish book
        run: quarto render book-es

      - name: Publish complete site
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
