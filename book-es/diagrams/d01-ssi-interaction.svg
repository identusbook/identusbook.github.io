<path d="M752 552 V600"/>
</g>
<path d="M456 464 H752" fill="none" stroke="#18bc9c" stroke-width="2" marker-end="url(#d01-arrow-accent)"/>
<g fill="#ffffff">
<rect x="216" y="200" width="184" height="32"/>
<rect x="500" y="312" width="208" height="32"/>
<rect x="504" y="424" width="200" height="32"/>
<rect x="772" y="560" width="168" height="24"/>
</g>
<g fill="#212529" font-size="20" text-anchor="middle" font-weight="600">
<text x="308" y="224">CREDENCIAL</text>
<text x="604" y="336">SOLICITA PRUEBA</text>
<text x="604" y="448">PRESENTACIÓN</text>
</g>
<text x="780" y="580" fill="#56616b" font-size="16">Si pasa las pruebas</text>
<g fill="#ffffff" stroke="#2c3e50" stroke-width="1">
<rect x="80" y="112" width="160" height="64" rx="4"/>
<rect x="376" y="112" width="160" height="64" rx="4"/>
<rect x="672" y="112" width="160" height="64" rx="4"/>
</g>
<g fill="#56616b" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
<text x="160" y="132">EMISOR</text><text x="456" y="132">TITULAR</text><text x="752" y="132">VERIFICADOR</text>
</g>
<g fill="#212529" font-size="24" font-weight="600" text-anchor="middle">
<text x="160" y="160">Universidad</text><text x="456" y="160">Alice</text><text x="752" y="160">Empleador</text>
</g>
<g fill="#f0f3f4" stroke="#b8c2c8" stroke-width="1">
<rect x="328" y="264" width="256" height="40" rx="4"/>
<rect x="328" y="376" width="256" height="40" rx="4"/>
</g>
<g fill="#212529" font-size="20" text-anchor="middle">
<text x="456" y="292">Billetera guarda credencial</text>
<text x="456" y="404">Alice autoriza compartir</text>
</g>
<rect x="600" y="488" width="304" height="64" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
<text x="752" y="516" fill="#212529" font-size="20" text-anchor="middle" font-weight="600">Verifica la prueba</text>
<text x="752" y="540" fill="#56616b" font-size="16" text-anchor="middle">Claves · vínculo con titular · estado</text>
