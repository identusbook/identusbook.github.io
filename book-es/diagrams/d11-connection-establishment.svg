<text x="480" y="372">Código QR o enlace, fuera de DIDComm</text>
<text x="480" y="596">DIDComm</text>
<text x="480" y="804">DIDComm</text>
</g>
<g fill="#ffffff" stroke="#2c3e50" stroke-width="1">
<rect x="96" y="112" width="320" height="72" rx="4"/>
<rect x="544" y="112" width="320" height="72" rx="4"/>
</g>
<g fill="#56616b" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">
<text x="256" y="136">INVITADOR</text>
<text x="704" y="136">INVITADO</text>
</g>
<g fill="#212529" font-size="24" font-weight="600" text-anchor="middle">
<text x="256" y="164">Cloud Agent A</text>
<text x="704" y="164">Cloud Agent B</text>
</g>
