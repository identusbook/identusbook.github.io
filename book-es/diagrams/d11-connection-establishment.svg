<text x="256" y="244">Controlador crea invitación</text>
<text x="704" y="452">Controlador acepta invitación</text>
<text x="256" y="668">Recibir y aceptar solicitud</text>
<text x="704" y="668">Solicitud enviada</text>
</g>
