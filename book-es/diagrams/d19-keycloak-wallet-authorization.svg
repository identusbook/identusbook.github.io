</g>
<path d="M832 1248 H352" fill="none" stroke="#18bc9c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#d19-arrow-accent)"/>
<g fill="#ffffff">
<rect x="360" y="220" width="224" height="44"/><rect x="360" y="316" width="224" height="44"/>
<rect x="600" y="412" width="224" height="44"/><rect x="600" y="500" width="224" height="36"/>
<rect x="360" y="588" width="224" height="44"/><rect x="360" y="676" width="224" height="36"/>
