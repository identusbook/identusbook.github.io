<title id="d12-credential-issuance-title">Emitir una credencial mediante DIDComm</title>
<desc id="d12-credential-issuance-desc">El controlador del emisor crea una oferta. El titular la revisa y acepta. El emisor envía una credencial después de la emisión automática o manual.</desc>
