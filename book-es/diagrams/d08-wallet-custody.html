<title id="d08-wallet-custody-title">Custodia de billeteras Edge y Cloud</title>
<desc id="d08-wallet-custody-desc">La aplicación del viajero ejecuta un SDK de Edge y proporciona almacenamiento local mediante Pluto. La organización ejecuta un controlador y Cloud Agent con una base de datos y almacenamiento de secretos bajo el control del operador del servicio. Los agentes intercambian mensajes DIDComm.</desc>

<figcaption>El equipo de la aplicación implementa el almacenamiento, la protección de claves y la recuperación para la billetera del viajero. El operador del servicio administra la ejecución de Cloud Agent, la base de datos, el almacenamiento de secretos y la recuperación. El enlace DIDComm representa el intercambio de protocolo; la entrega puede usar un mediador.</figcaption>
