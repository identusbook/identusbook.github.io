<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 776" role="img" aria-labelledby="d01-ssi-interaction-title d01-ssi-interaction-desc">
<title id="d01-ssi-interaction-title">La interacción SSI</title>
<desc id="d01-ssi-interaction-desc">Una universidad emite una credencial de título a Alice; ella la guarda y autoriza la solicitud de prueba de un empleador antes de que su billetera envíe una presentación para las comprobaciones técnicas y la política de aceptación del empleador.</desc>
<defs>
<marker id="d01-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56616b"/></marker>
<marker id="d01-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18bc9c"/></marker>
<marker id="d01-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18bc9c"/></marker>
</defs>
<rect width="960" height="776" fill="#ffffff"/>
<g fill="#212529">
<text x="40" y="48" font-size="28" font-weight="600">La interacción SSI</text>
<text x="40" y="80" font-size="20" fill="#56616b">Un título universitario que Alice presenta a un empleador</text>
</g>
<g stroke="#b8c2c8" stroke-width="1" stroke-dasharray="4 4">
<path d="M160 176 V688"/><path d="M456 176 V688"/><path d="M752 176 V488"/>
