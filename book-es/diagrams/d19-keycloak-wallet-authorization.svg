<rect x="600" y="940" width="208" height="44"/><rect x="600" y="1036" width="224" height="44"/>
<rect x="600" y="1124" width="224" height="36"/><rect x="600" y="1204" width="208" height="36"/>
</g>
<g fill="#212529" font-size="18" font-weight="600" text-anchor="middle">
<text x="472" y="240">1 · Crear billetera</text><text x="472" y="336">2 · Conceder permiso</text><text x="472" y="356">de billetera</text>
<text x="712" y="432">Crear permiso</text><text x="712" y="452">UMA</text><text x="712" y="524">Permiso creado</text>
<text x="472" y="608">3 · Autenticarse</text><text x="472" y="628">con OIDC</text><text x="472" y="700">Token de acceso OIDC</text>
<text x="472" y="784">4 · Solicitar</text><text x="472" y="804">UMA RPT</text><text x="472" y="876">Token de parte solicitante</text>
<text x="704" y="960">5 · Llamar con</text><text x="704" y="980">Bearer RPT</text>
<text x="712" y="1056">Inspeccionar token</text><text x="712" y="1076">y permisos</text>
<text x="712" y="1148">Activo · una billetera</text><text x="704" y="1228" fill="#212529">Respuesta de la billetera</text>
</g>
