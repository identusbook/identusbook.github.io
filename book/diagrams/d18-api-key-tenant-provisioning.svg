<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 884" role="img" aria-labelledby="d18-api-key-tenant-provisioning-title d18-api-key-tenant-provisioning-desc">
<title id="d18-api-key-tenant-provisioning-title">API key tenant provisioning</title>
<desc id="d18-api-key-tenant-provisioning-desc">An administrator authenticates with the admin token, creates a wallet, creates an entity assigned to that wallet, and registers the tenant API key. The tenant then uses that API key for a request scoped to the assigned wallet.</desc>
<defs>
<marker id="d18-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56616b"/></marker>
<marker id="d18-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18bc9c"/></marker>
<marker id="d18-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56616b"/></marker>
</defs>
<rect width="960" height="884" fill="#ffffff"/>
<text x="40" y="48" fill="#212529" font-size="28" font-weight="600">API key tenant provisioning</text>
<text x="40" y="80" fill="#56616b" font-size="20">Manual onboarding when automatic provisioning is disabled</text>
<g stroke="#b8c2c8" stroke-width="1" stroke-dasharray="6 6">
<path d="M176 184 V824"/><path d="M480 184 V824"/><path d="M784 184 V824"/>
</g>
<g fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d18-arrow)">
<path d="M176 296 H480"/><path d="M480 372 H176" stroke-dasharray="6 6"/>
<path d="M176 468 H480"/><path d="M480 544 H176" stroke-dasharray="6 6"/>
<path d="M176 640 H480"/><path d="M784 736 H480"/>
</g>
<path d="M480 812 H784" fill="none" stroke="#18bc9c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#d18-arrow-accent)"/>
<g fill="#ffffff">
<rect x="184" y="244" width="288" height="44"/><rect x="224" y="328" width="208" height="36"/>
<rect x="184" y="416" width="288" height="44"/><rect x="224" y="500" width="208" height="36"/>
<rect x="184" y="568" width="288" height="64"/><rect x="488" y="684" width="288" height="44"/>
<rect x="528" y="768" width="208" height="36"/>
</g>
<g fill="#212529" font-size="20" font-weight="600" text-anchor="middle">
<text x="328" y="264">1 · Create wallet</text><text x="328" y="352">walletId</text>
<text x="328" y="436">2 · Create entity</text><text x="328" y="524">entityId</text>
<text x="328" y="588">3 · Register API key</text><text x="632" y="704">4 · Tenant API request</text>
<text x="632" y="792" fill="#212529">Wallet-scoped response</text>
</g>
<g fill="#56616b" font-size="16" text-anchor="middle">
<text class="technical" x="328" y="284">POST /wallets</text><text class="technical" x="328" y="456">POST /iam/entities</text>
<text class="technical" x="328" y="608">POST /iam/</text><text class="technical" x="328" y="628">apikey-authentication</text><text class="technical" x="632" y="724">apikey: tenant-api-key</text>
</g>
<g fill="#ffffff" stroke="#2c3e50" stroke-width="1">
<rect x="64" y="112" width="224" height="72" rx="4"/><rect x="368" y="112" width="224" height="72" rx="4"/><rect x="672" y="112" width="224" height="72" rx="4"/>
</g>
<g fill="#56616b" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
<text x="176" y="136">ADMIN ROLE</text><text x="480" y="136">TENANT STORE</text><text x="784" y="136">TENANT ROLE</text>
</g>
<g fill="#212529" font-size="24" font-weight="600" text-anchor="middle">
<text x="176" y="168">Administrator</text><text x="480" y="168">Cloud Agent</text><text x="784" y="168">Tenant controller</text>
</g>
<path d="M40 840 H920" stroke="#dce1e4" stroke-width="1"/>
<text class="technical" x="40" y="872" fill="#56616b" font-size="16">Steps 1–3: x-admin-api-key · Step 4: apikey</text>
</svg>
