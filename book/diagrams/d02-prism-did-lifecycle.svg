<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="d02-prism-did-lifecycle-title d02-prism-did-lifecycle-desc">
<title id="d02-prism-did-lifecycle-title">PRISM DID lifecycle</title>
<desc id="d02-prism-did-lifecycle-desc">The controller creates an unpublished long-form PRISM DID, publishes it for registry-backed resolution, can update its keys and services, and can deactivate it; long and short forms identify the same DID.</desc>
<defs>
<marker id="d02-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56616b"/></marker>
<marker id="d02-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18bc9c"/></marker>
<marker id="d02-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18bc9c"/></marker>
</defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="40" y="48" fill="#212529" font-size="28" font-weight="600">PRISM DID lifecycle</text>
<text x="40" y="80" fill="#56616b" font-size="20">Conceptual states of one DID</text>
<g fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d02-arrow)">
<path d="M136 184 V272"/>
<path d="M432 272 V200 A8 8 0 0 1 440 192 H520 A8 8 0 0 1 528 200 V272"/>
<path d="M576 336 H728"/>
</g>
<path d="M232 336 H384" fill="none" stroke="#18bc9c" stroke-width="2" marker-end="url(#d02-arrow-accent)"/>
<g fill="#ffffff">
<rect x="144" y="216" width="104" height="32"/>
<rect x="432" y="152" width="96" height="32"/>
<rect x="260" y="296" width="96" height="32"/>
<rect x="588" y="296" width="128" height="32"/>
</g>
<g fill="#212529" font-size="20" font-weight="600">
<text x="152" y="240">CREATE</text>
<text x="480" y="176" text-anchor="middle">UPDATE</text>
<text x="308" y="320" text-anchor="middle">PUBLISH</text>
<text x="652" y="320" text-anchor="middle">DEACTIVATE</text>
</g>
<text x="560" y="204" fill="#56616b" font-size="16">Change keys or services</text>
<circle cx="136" cy="176" r="8" fill="#2c3e50"/>
<rect x="40" y="272" width="192" height="128" rx="4" fill="#f0f3f4" stroke="#b8c2c8" stroke-width="1"/>
<rect x="384" y="272" width="192" height="128" rx="4" fill="#eefaf7" stroke="#18bc9c" stroke-width="1"/>
<rect x="728" y="272" width="192" height="128" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
<g fill="#56616b" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
<text x="136" y="296">LOCAL</text>
<text x="480" y="296">ACTIVE</text>
<text x="824" y="296">FINAL</text>
</g>
<g fill="#212529" font-size="24" font-weight="600" text-anchor="middle">
<text x="136" y="328">Unpublished</text>
<text x="480" y="328">Published</text>
<text x="824" y="328">Deactivated</text>
</g>
<g fill="#212529" font-size="20" text-anchor="middle">
<text x="136" y="356">Long form</text>
<text x="480" y="356">Short form</text>
<text x="824" y="356">Inactive DID</text>
</g>
<g fill="#56616b" font-size="16" text-anchor="middle">
<text x="136" y="384">Carries initial state</text>
<text x="480" y="384">Registry-backed state</text>
<text x="824" y="384">Further changes stop</text>
</g>
<g fill="#212529" font-size="20" font-weight="600">
<text x="40" y="464">Long form</text>
<text x="536" y="464">Short form</text>
</g>
<g fill="#56616b" font-size="16">
<text class="did-syntax" x="40" y="496">did:prism:&lt;initial-hash&gt;:&lt;encoded-state&gt;</text>
<text class="did-syntax" x="536" y="496">did:prism:&lt;initial-hash&gt;</text>
</g>
<text x="40" y="544" fill="#212529" font-size="20">Both forms identify the same DID. Updates change its document.</text>
<path d="M40 576 H920" stroke="#dce1e4" stroke-width="1"/>
<text x="40" y="608" fill="#56616b" font-size="16">Arrows show successful operations. Resolution reads state without changing it.</text>
</svg>
