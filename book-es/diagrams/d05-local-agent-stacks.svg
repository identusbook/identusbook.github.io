<title id="d05-local-agent-stacks-title">Dos instancias locales de Cloud Agent</title>
<desc id="d05-local-agent-stacks-desc">El controlador accede a proyectos Docker Compose distintos de emisor y verificador mediante los puertos 8000 y 9000 del anfitrión; cada proyecto contiene APISIX, Cloud Agent, PostgreSQL, PRISM Node y Vault, con puertos de base de datos distintos, 5432 y 5433.</desc>
