<text x="472" y="240">1 · Create wallet</text><text x="472" y="336">2 · Grant wallet</text><text x="472" y="356">permission</text>
<text x="712" y="432">Create UMA</text><text x="712" y="452">permission</text><text x="712" y="524">Permission created</text>
