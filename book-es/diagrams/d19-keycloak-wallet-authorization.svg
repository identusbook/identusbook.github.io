<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1308" role="img" aria-labelledby="d19-keycloak-wallet-authorization-title d19-keycloak-wallet-authorization-desc">
<title id="d19-keycloak-wallet-authorization-title">Autorización de billetera con Keycloak</title>
<desc id="d19-keycloak-wallet-authorization-desc">Un administrador crea una billetera y concede permisos a un sujeto Keycloak. El controlador del inquilino obtiene un token de acceso OIDC, lo intercambia por un token de parte solicitante UMA y llama a Cloud Agent. Cloud Agent inspecciona el token y sus permisos mediante Keycloak antes de devolver datos de la billetera autorizada.</desc>
<defs>
<marker id="d19-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56616b"/></marker>
<marker id="d19-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18bc9c"/></marker>
<marker id="d19-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56616b"/></marker>
</defs>
<rect width="960" height="1308" fill="#ffffff"/>
<text x="40" y="48" fill="#212529" font-size="28" font-weight="600">Autorización de billetera con Keycloak</text>
<text x="40" y="80" fill="#56616b" font-size="20">Intercambio OIDC a UMA administrado por el controlador</text>
