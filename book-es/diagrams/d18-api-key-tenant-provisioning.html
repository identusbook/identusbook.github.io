<title id="d18-api-key-tenant-provisioning-title">Aprovisionamiento de inquilinos con clave de API</title>
<desc id="d18-api-key-tenant-provisioning-desc">Un administrador se autentica con el token de administración, crea una billetera, crea una entidad asignada a ella y registra la clave de API del inquilino. El inquilino usa después esa clave para una solicitud limitada a su billetera asignada.</desc>

<figcaption>Con <code>API_KEY_AUTO_PROVISIONING=false</code>, el administrador crea la billetera, la entidad y la clave de API. La clave de API del inquilino selecciona la billetera asignada a la entidad.</figcaption>
