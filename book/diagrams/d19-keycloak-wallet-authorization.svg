<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1308" role="img" aria-labelledby="d19-keycloak-wallet-authorization-title d19-keycloak-wallet-authorization-desc">
<title id="d19-keycloak-wallet-authorization-title">Keycloak wallet authorization</title>
<desc id="d19-keycloak-wallet-authorization-desc">An administrator creates a wallet and grants a Keycloak subject permission to it. The tenant controller obtains an OIDC access token, exchanges it for an UMA requesting party token, and calls the Cloud Agent. The Cloud Agent introspects the token and its permissions through Keycloak before returning data from the permitted wallet.</desc>
