<title id="d04-identus-components-title">Componentes de Identus y vías de comunicación</title>
<desc id="d04-identus-components-desc">Un controlador llama a Cloud Agent mediante REST; una billetera Edge Agent envía mensajes DIDComm a Cloud Agent y obtiene mensajes entrantes mediante un mediador; Cloud Agent usa PRISM Node para publicar y resolver DIDs en un registro.</desc>
