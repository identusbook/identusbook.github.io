<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Lato, -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1064" role="img" aria-labelledby="d11-connection-establishment-title d11-connection-establishment-desc">
<title id="d11-connection-establishment-title">Establecer una conexión entre dos agentes</title>
<desc id="d11-connection-establishment-desc">El invitador crea y comparte una invitación. El invitado la acepta y envía una solicitud de conexión DIDComm. El invitador envía una respuesta. Cada Cloud Agent mantiene un registro de conexión local separado con su propio estado.</desc>
<defs>
<marker id="d11-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#56616b"/></marker>
</defs>
<rect width="960" height="1064" fill="#ffffff"/>
<text x="40" y="48" fill="#212529" font-size="28" font-weight="600">Establecer una conexión entre dos agentes</text>
<text x="40" y="80" fill="#56616b" font-size="20">Dos Cloud Agents; algunas llamadas API y estados de registros</text>
<g stroke="#b8c2c8" stroke-width="1" stroke-dasharray="6 6">
<path d="M256 184 V992"/>
<path d="M704 184 V992"/>
</g>
<g fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#d11-arrow)">
<path d="M256 384 H704"/>
<path d="M704 608 H256"/>
</g>
<path d="M256 816 H704" fill="none" stroke="#56616b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#d11-arrow)"/>
