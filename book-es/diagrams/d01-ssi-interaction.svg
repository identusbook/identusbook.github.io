<text x="752" y="628" fill="#212529" font-size="20" text-anchor="middle" font-weight="600">Empleador aplica su política</text>
<text x="752" y="652" fill="#56616b" font-size="16" text-anchor="middle">Universidad y título aceptados</text>
<text x="752" y="672" fill="#212529" font-size="16" text-anchor="middle" font-weight="600">Aceptar o rechazar</text>
<rect x="64" y="528" width="432" height="72" fill="#ffffff"/>
