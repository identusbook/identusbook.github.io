<title id="d14-presentation-verification-title">Presentar una prueba y aceptar el resultado</title>
<desc id="d14-presentation-verification-desc">El titular aprueba una solicitud de prueba y selecciona credenciales. El agente del verificador comprueba la presentación recibida y su controlador aplica la política antes de aceptarla.</desc>
