<path d="M40 1016 H920" stroke="#dce1e4" stroke-width="1"/>
<text x="40" y="1048" fill="#56616b" font-size="16">Los cuadros muestran acciones y estados locales. Las flechas muestran intercambios de invitación y protocolo.</text>
</svg>
